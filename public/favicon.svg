<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGradient" x1="120" y1="120" x2="392" y2="392">
      <stop offset="0%" stop-color="#3BA8FF"/>
      <stop offset="100%" stop-color="#C8F04A"/>
    </linearGradient>

    <linearGradient id="speedGradient" x1="80" y1="256" x2="220" y2="256">
      <stop offset="0%" stop-color="#1E5EFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4CC2FF"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="20" y="20" width="472" height="472" rx="90" fill="#001B57"/>

  <!-- Speed lines -->
  <rect x="70" y="205" width="130" height="20" rx="10" fill="url(#speedGradient)"/>
  <rect x="70" y="255" width="160" height="20" rx="10" fill="url(#speedGradient)"/>
  <rect x="70" y="305" width="110" height="20" rx="10" fill="url(#speedGradient)"/>

  <!-- Stopwatch ring -->
  <circle
    cx="256"
    cy="256"
    r="145"
    fill="none"
    stroke="url(#ringGradient)"
    stroke-width="26"
  />

  <!-- Top button -->
  <rect x="236" y="78" width="40" height="30" rx="6" fill="#4CC2FF"/>

  <!-- Clock ticks -->
  <line x1="256" y1="138" x2="256" y2="158"
        stroke="white" stroke-width="6" stroke-linecap="round"/>

  <line x1="374" y1="256" x2="354" y2="256"
        stroke="white" stroke-width="6" stroke-linecap="round"/>

  <line x1="256" y1="374" x2="256" y2="354"
        stroke="white" stroke-width="6" stroke-linecap="round"/>

  <line x1="340" y1="340" x2="326" y2="326"
        stroke="white" stroke-width="6" stroke-linecap="round"/>

  <line x1="340" y1="172" x2="326" y2="186"
        stroke="#9CF45A" stroke-width="6" stroke-linecap="round"/>

  <!-- Clock hand -->
  <circle cx="256" cy="256" r="18" fill="white"/>

  <line
    x1="256"
    y1="256"
    x2="318"
    y2="194"
    stroke="white"
    stroke-width="14"
    stroke-linecap="round"
  />
</svg>
